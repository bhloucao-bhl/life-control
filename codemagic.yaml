workflows:
  ios-testflight:
    name: iOS — Life Control (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: life-control-asc
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.bhloucao.lifecontrol"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Instalar dependências npm
        script: npm ci
      - name: Capacitor sync (copia config/assets pro projeto iOS)
        script: npx cap sync ios
      - name: Preparar o keychain e importar o certificado (enviado manualmente, em base64)
        script: |
          echo "$IOS_P12_CERT" | base64 --decode > "$CM_BUILD_DIR/ios_distribution.p12"
          keychain initialize
          keychain add-certificates --certificate "$CM_BUILD_DIR/ios_distribution.p12" --certificate-password "$IOS_P12_PASSWORD"
      - name: Instalar o perfil de provisionamento (enviado manualmente, em base64) e aplicar no projeto Xcode
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_DIR/life-control.mobileprovision"
          xcode-project use-profiles
      - name: Build do .ipa assinado
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
