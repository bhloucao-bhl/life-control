workflows:
  ios-testflight:
    name: iOS — Life Control (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: life-control-asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bhloucao.lifecontrol
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Instalar dependências npm
        script: npm ci
      - name: Capacitor sync (copia config/assets pro projeto iOS)
        script: npx cap sync ios
      - name: Configurar assinatura automática (certificados/perfis via App Store Connect)
        script: xcode-project use-profiles
      - name: Build do .ipa assinado
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
