workflows:
  ios-testflight:
    name: iOS — Life Control (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: life-control-asc
    environment:
      vars:
        BUNDLE_ID: "com.bhloucao.lifecontrol"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Instalar dependências npm
        script: npm ci
      - name: Capacitor sync (copia config/assets pro projeto iOS)
        script: npx cap sync ios
      - name: Preparar o keychain e importar o certificado (enviado manualmente)
        script: |
          keychain initialize
          keychain add-certificates
      - name: Aplicar o perfil de provisionamento (enviado manualmente) no projeto Xcode
        script: xcode-project use-profiles
      - name: Build do .ipa assinado
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
