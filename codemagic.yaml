workflows:
  ios-testflight:
    name: iOS — Life Control (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: life-control-asc
    environment:
      groups:
        - Ios_signing
      vars:
        BUNDLE_ID: "com.bhloucao.lifecontrol"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Instalar dependências npm
        script: npm ci
      - name: Capacitor sync (copia config/assets pro projeto iOS)
        script: npx cap sync ios
      - name: Preparar o keychain e importar o certificado (enviado manualmente, em base64)
        script: |
          echo "$IOS_P12_CERT" | base64 --decode > "$CM_BUILD_DIR/ios_distribution.p12"
          keychain initialize
          keychain add-certificates --certificate "$CM_BUILD_DIR/ios_distribution.p12" --certificate-password "$IOS_P12_PASSWORD"
      - name: Instalar os perfis de provisionamento (enviados manualmente, em base64) e aplicar no projeto Xcode
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_DIR/life-control.mobileprovision"
          # Perfil do target de widgets (com.bhloucao.lifecontrol.LifeControlWidgets), com o App
          # Group habilitado. Só existe depois que o App ID + o App Group forem criados no Apple
          # Developer Portal e o perfil gerado — até lá, este passo é pulado sem quebrar o build do
          # app principal (o target de widgets simplesmente não fica assinado/embutido).
          if [ -n "$IOS_WIDGET_PROVISIONING_PROFILE" ]; then
            echo "$IOS_WIDGET_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_DIR/life-control-widgets.mobileprovision"
          fi
          xcode-project use-profiles
      - name: Build do .ipa assinado
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$PROJECT_BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
