name: Oura health history snapshot

# Roda 2x por dia (6h e 20h de Brasília = 09:00 e 23:00 UTC) e chama
# /api/cron/oura-snapshot no app publicado: atualiza os dados da Oura e a
# bateria do anel de todo mundo conectado, gravando no cache e no histórico
# permanente de saúde (health_daily — ver schema8.sql). O webhook da Oura já
# atualiza os dados a cada sincronização do anel; este cron é a rede de
# segurança se um evento se perder e a única leitura agendada da bateria.
# (O GitHub pode atrasar execuções agendadas em alguns minutos.)
#
# Mesmo esquema do mercadolivre-sync.yml/morning-brief.yml — contas Hobby da
# Vercel só permitem cron nativo diário, não horário. Precisa dos mesmos
# secrets:
#   - APP_BASE_URL: URL pública do app (ex: https://life-control.vercel.app)
#   - CRON_SECRET: o mesmo valor da variável de ambiente CRON_SECRET na Vercel

on:
  schedule:
    - cron: '0 9,23 * * *'
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call oura-snapshot endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/oura-snapshot"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
