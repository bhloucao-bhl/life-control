name: Evening review push

# Roda a cada 10 minutos, o dia inteiro, e chama /api/cron/evening-review no
# app publicado. O horário exato de disparo (e se manda ou não) é decidido
# lá dentro, por usuário, com base em settings.notifPrefs.evening — a rota
# só manda a notificação uma vez por dia, no horário que a pessoa escolheu
# em Ajustes (17h30 por padrão).
#
# Mesmo esquema do morning-brief.yml e do mercadolivre-sync.yml. Precisa dos
# mesmos secrets:
#   - APP_BASE_URL: URL pública do app (ex: https://life-control.vercel.app)
#   - CRON_SECRET: o mesmo valor da variável de ambiente CRON_SECRET na Vercel

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Call evening-review endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/evening-review"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
