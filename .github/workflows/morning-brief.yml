name: Morning brief push

# Roda a cada 10 minutos, o dia inteiro, e chama /api/cron/morning-brief no
# app publicado. O horário exato de disparo (e se manda ou não) é decidido
# lá dentro, por usuário, com base em settings.notifPrefs.morning — a rota
# só manda a notificação uma vez por dia, no horário que a pessoa escolheu
# em Ajustes (07h30 por padrão).
#
# Mesmo motivo do sync do Mercado Livre (ver mercadolivre-sync.yml): a Vercel
# Hobby só permite escolher o minuto do cron nativo de forma limitada, então
# usamos GitHub Actions. Precisa dos mesmos secrets:
#   - APP_BASE_URL: URL pública do app (ex: https://life-control.vercel.app)
#   - CRON_SECRET: o mesmo valor da variável de ambiente CRON_SECRET na Vercel

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Call morning-brief endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/morning-brief"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
